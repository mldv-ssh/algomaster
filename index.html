;
// ================== INTERPRÉTEUR DE PSEUDO-CODE ==================
// Comprend la syntaxe du cours : ←, Lire, Afficher, Si/Sinon Si/Sinon/FinSi, Pour/FinPour (pas de),
// Pour chaque, TantQue/FinTantQue, Répéter/Jusqu'à, Fonction/Procédure/Retourner, tableaux, ensembles.
const PC = (() => {
  const STRIP = {"à":"a","â":"a","ä":"a","á":"a","é":"e","è":"e","ê":"e","ë":"e","î":"i","ï":"i","ô":"o","ö":"o","ù":"u","û":"u","ü":"u","ç":"c","œ":"o"};
  // même longueur que l'entrée : les indices des captures restent valables sur le texte d'origine
  const low = s => s.toLowerCase().replace(/[^\x00-\x7f]/g, c => STRIP[c] || c);

  class PErr extends Error { constructor(msg, ln){ super(msg); this.ln = ln; } }
  class Ret { constructor(v){ this.v = v; } }

  // ---------- lignes ----------
  function prep(src){
    return src.replace(/\r/g,"").split("\n").map((raw,i)=>{
      const s = raw.replace(/<-/g,"←").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/\t/g,"   ").replace(/[“”]/g,'"');
      let inS=false, out="";
      for(let k=0;k<s.length;k++){ const c=s[k]; if(c==='"') inS=!inS; if(!inS && c==="/" && s[k+1]==="/") break; out+=c; }
      out = out.trim().replace(/^\d+\.\s+/,"");
      return {t:out, n:low(out), ln:i+1};
    }).filter(l=>l.t);
  }

  // ---------- expressions ----------
  function lex(s, ln){
    const T=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(/\s/.test(c)){ i++; continue; }
      if(/\d/.test(c)){ let j=i; while(j<s.length && /\d/.test(s[j])) j++; if(s[j]==="." && /\d/.test(s[j+1]||"")){ j++; while(j<s.length && /\d/.test(s[j])) j++; } T.push({k:"num",v:parseFloat(s.slice(i,j))}); i=j; continue; }
      if(c==='"'){ const j=s.indexOf('"',i+1); if(j<0) throw new PErr('Guillemet " non fermé',ln); T.push({k:"str",v:s.slice(i+1,j)}); i=j+1; continue; }
      if(/[A-Za-z_À-ſ]/.test(c)){ let j=i; while(j<s.length && /[\wÀ-ſ]/.test(s[j])) j++; const w=s.slice(i,j); T.push({k:"id",v:w,n:low(w)}); i=j; continue; }
      const two=s.slice(i,i+2);
      if(["<=",">=","<>","!=","=="].includes(two)){ T.push({k:"op",v:two==="<>"||two==="!="?"≠":two==="=="?"=":two}); i+=2; continue; }
      if(c==="%"){ T.push({k:"id",v:"MOD",n:"mod"}); i++; continue; }
      if("+-*/()[],=<>≠×÷".includes(c)){ T.push({k:"op",v:c==="×"?"*":c==="÷"?"/":c}); i++; continue; }
      if(c==="←") throw new PErr("« ← » ne peut pas être utilisé au milieu d'une expression",ln);
      throw new PErr(`Caractère inattendu « ${c} »`,ln);
    }
    return T;
  }
  function parseExpr(text, ln){
    const T=lex(text,ln); let p=0;
    const isOp=v=>T[p]&&T[p].k==="op"&&T[p].v===v;
    const isKw=w=>T[p]&&T[p].k==="id"&&T[p].n===w;
    const expect=v=>{ if(!isOp(v)) throw new PErr(`« ${v} » attendu`+(T[p]?` avant « ${T[p].v} »`:" en fin d'expression"),ln); p++; };
    const or=()=>{ let l=and(); while(isKw("ou")){ p++; l={t:"or",l,r:and()}; } return l; };
    const and=()=>{ let l=not(); while(isKw("et")){ p++; l={t:"and",l,r:not()}; } return l; };
    const not=()=>{ if(isKw("non")){ p++; return {t:"not",e:not()}; } return cmp(); };
    const cmp=()=>{ let l=add();
      for(;;){ const t=T[p];
        if(t&&t.k==="op"&&["=","≠","<",">","<=",">="].includes(t.v)){ p++; l={t:"bin",op:t.v,l,r:add()}; }
        else if(isKw("appartient")){ p++; if(isKw("a")) p++; l={t:"in",l,r:add()}; }
        else return l; } };
    const add=()=>{ let l=mul(); while(isOp("+")||isOp("-")){ const o=T[p++].v; l={t:"bin",op:o,l,r:mul()}; } return l; };
    const mul=()=>{ let l=un(); for(;;){ if(isOp("*")||isOp("/")){ const o=T[p++].v; l={t:"bin",op:o,l,r:un()}; } else if(isKw("mod")||isKw("div")){ const o=T[p++].n; l={t:"bin",op:o,l,r:un()}; } else return l; } };
    const un=()=>{ if(isOp("-")){ p++; return {t:"neg",e:un()}; } if(isOp("+")){ p++; return un(); } return post(); };
    const post=()=>{ let e=prim(); while(isOp("[")){ p++; const i=or(); expect("]"); e={t:"idx",a:e,i}; } return e; };
    const list=close=>{ const a=[]; if(!isOp(close)){ do{ a.push(or()); } while(isOp(",")&&++p); } expect(close); return a; };
    const prim=()=>{
      const t=T[p++];
      if(!t) throw new PErr("Expression incomplète (il manque une valeur)",ln);
      if(t.k==="num"||t.k==="str") return {t:"lit",v:t.v};
      if(t.k==="op"&&t.v==="("){ const e=or(); expect(")"); return e; }
      if(t.k==="op"&&t.v==="[") return {t:"list",items:list("]")};
      if(t.k==="id"){
        if(t.n==="vrai") return {t:"lit",v:true};
        if(t.n==="faux") return {t:"lit",v:false};
        if(t.n==="ensemble"){ if(isKw("vide")) p++; return {t:"set"}; }
        if(isOp("(")){ p++; return {t:"call",name:t.v,args:list(")")}; }
        if(["et","ou","mod","div","alors","faire","sinon"].includes(t.n)) throw new PErr(`Mot-clé « ${t.v} » mal placé`,ln);
        return {t:"var",name:t.v};
      }
      throw new PErr(`Symbole inattendu « ${t.v} »`,ln);
    };
    const e=or();
    if(p<T.length) throw new PErr(`Symbole inattendu « ${T[p].v} » (opérateur oublié ? « Alors »/« Faire » mal placé ?)`,ln);
    return e;
  }
  const target=(text,ln)=>{ const e=parseExpr(text,ln); if(e.t!=="var"&&e.t!=="idx") throw new PErr(`« ${text} » n'est pas une variable : on ne peut rien y ranger`,ln); return e; };

  // ---------- instructions ----------
  const RX = [
    ["skip",   /^(debut|fin|demarrer)\s*:?$/d],
    ["skip",   /^(algorithme|programme)\b/d],
    ["skip",   /^(variables?|entrees?|sorties?|donnees?)\s*:/d],
    ["skip",   /^(variables?)$/d],
    ["skip",   /^(declarer|var|constante)\s/d],
    ["skip",   /^(?!fonction|procedure)[^←"]*:\s*(un |une |des )?(entier|reel|chaine|booleen|tableau|ensemble|caractere|nombre)/d],
    ["func",   /^(fonction|procedure)\s+(\w+)\s*\((.*)\)\s*(?::.*)?$/d],
    ["endf",   /^fin\s*(fonction|procedure)$/d],
    ["elif",   /^sinon\s*si\s+(.+?)\s+alors\s*:?$/d],
    ["else",   /^sinon\s*:?$/d],
    ["endif",  /^fin\s*si$/d],
    ["if",     /^si\s+(.+?)\s+alors\s*:?$/d],
    ["foreach",/^pour\s+chaque\s+(\w+)\s+(?:dans|de)\s+(.+?)(?:\s+faire)?\s*:?$/d],
    ["for",    /^pour\s+(\w+)\s+(?:allant\s+)?(?:de\s+|←\s*|=\s*)(.+?)\s+(?:a|jusqu'a|jusqua)\s+(.+?)(?:\s+(?:par\s+)?pas\s+(?:de\s+)?(.+?))?(?:\s+faire)?\s*:?$/d],
    ["endfor", /^fin\s*pour$/d],
    ["while",  /^tant\s*que\s+(.+?)(?:\s+faire)?\s*:?$/d],
    ["endwhile",/^(fin\s*tant\s*que|fintq)$/d],
    ["repeat", /^repeter\s*:?$/d],
    ["until",  /^jusqu'?\s*a\s+(.+)$/d],
    ["ret",    /^(?:retourner|renvoyer|retourne)\b\s*(.*)$/d],
    ["read",   /^(?:lire|saisir)\s+(.+)$/d],
    ["print",  /^(?:afficher|affiche|ecrire|ecris)\b\s*(.*)$/d],
    ["add",    /^ajouter\s+(.+?)\s+(?:a|dans)\s+(\w+)$/d],
    ["assign", /^(.+?)\s*←\s*(.*)$/d],
    ["call",   /^(\w+\s*\(.*\))$/d],
  ];
  const NAMES = {endif:"FinSi",endfor:"FinPour",endwhile:"FinTantQue",until:"Jusqu'à",endf:"FinFonction",else:"Sinon",elif:"Sinon Si"};
  function kind(l){
    for(const [type,re] of RX){ const m=re.exec(l.n); if(m) return {type, g:m.indices.map(ix=>ix?l.t.slice(ix[0],ix[1]):undefined)}; }
    if(/^si\s/.test(l.n)) throw new PErr("Il manque « Alors » à la fin de la ligne Si",l.ln);
    if(/^[\w\[\]]+\s*=[^=]/.test(l.n)) throw new PErr("Pour ranger une valeur dans une variable, utilise ← (ou <-), pas =. Le = sert à comparer.",l.ln);
    throw new PErr(`Instruction non comprise : « ${l.t} »`,l.ln);
  }

  function parse(src){
    const L=prep(src); let i=0; const funcs={}, main=[];
    function block(ends){
      const body=[];
      while(i<L.length){
        const l=L[i], k=kind(l);
        if(ends.includes(k.type)) return {body,end:k,line:l};
        i++; const s=stmt(k,l); if(s) body.push(s);
      }
      return {body,end:null};
    }
    function stmt(k,l){
      const g=k.g, ln=l.ln;
      switch(k.type){
        case "skip": return null;
        case "assign": { if(!g[2].trim()) throw new PErr("Rien à droite de ←",ln); return {t:"assign",ln,tg:target(g[1],ln),e:parseExpr(g[2],ln)}; }
        case "print": return {t:"print",ln,args:g[1].trim()?parseExpr("["+g[1]+"]",ln).items:[]};
        case "read": return {t:"read",ln,tgs:g[1].split(",").map(x=>target(x.trim(),ln))};
        case "ret": return {t:"ret",ln,e:g[1].trim()?parseExpr(g[1],ln):null};
        case "add": return {t:"add",ln,e:parseExpr(g[1],ln),set:g[2]};
        case "call": return {t:"expr",ln,e:parseExpr(g[1],ln)};
        case "if": {
          const node={t:"if",ln,br:[{c:parseExpr(g[1],ln)}],els:null};
          let r=block(["elif","else","endif"]); node.br[0].b=r.body;
          while(r.end&&r.end.type==="elif"){ i++; const br={c:parseExpr(r.end.g[1],r.line.ln)}; r=block(["elif","else","endif"]); br.b=r.body; node.br.push(br); }
          if(r.end&&r.end.type==="else"){ i++; r=block(["endif"]); node.els=r.body; }
          if(!r.end) throw new PErr(`Le « Si » de la ligne ${ln} n'est jamais fermé : il manque FinSi`,ln);
          i++; return node;
        }
        case "for": { const r=block(["endfor"]); if(!r.end) throw new PErr(`Le « Pour » de la ligne ${ln} n'est jamais fermé : il manque FinPour`,ln); i++;
          return {t:"for",ln,v:g[1],a:parseExpr(g[2],ln),b:parseExpr(g[3],ln),st:g[4]?parseExpr(g[4],ln):null,body:r.body}; }
        case "foreach": { const r=block(["endfor"]); if(!r.end) throw new PErr(`Le « Pour chaque » de la ligne ${ln} n'est jamais fermé : il manque FinPour`,ln); i++;
          return {t:"foreach",ln,v:g[1],e:parseExpr(g[2],ln),body:r.body}; }
        case "while": { const r=block(["endwhile"]); if(!r.end) throw new PErr(`Le « TantQue » de la ligne ${ln} n'est jamais fermé : il manque FinTantQue`,ln); i++;
          return {t:"while",ln,c:parseExpr(g[1],ln),body:r.body}; }
        case "repeat": { const r=block(["until"]); if(!r.end) throw new PErr(`Le « Répéter » de la ligne ${ln} n'a pas de « Jusqu'à »`,ln); i++;
          return {t:"repeat",ln,c:parseExpr(r.end.g[1],r.line.ln),body:r.body}; }
        case "func": throw new PErr("On ne peut pas définir une fonction à l'intérieur d'un bloc",ln);
        default: throw new PErr(`« ${NAMES[k.type]||l.t} » inattendu ici (aucun bloc correspondant ouvert)`,ln);
      }
    }
    while(i<L.length){
      const l=L[i], k=kind(l);
      if(k.type==="func"){
        i++;
        const params=k.g[3].split(",").map(x=>x.split(":")[0].trim()).filter(Boolean);
        const r=block(["endf"]);
        if(!r.end) throw new PErr(`La ${low(k.g[1])==="fonction"?"fonction":"procédure"} « ${k.g[2]} » n'est jamais fermée : il manque Fin${k.g[1]}`,l.ln);
        i++;
        funcs[low(k.g[2])]={name:k.g[2],proc:low(k.g[1])==="procedure",params,body:r.body,ln:l.ln};
      } else { i++; const s=stmt(k,l); if(s) main.push(s); }
    }
    return {funcs,main};
  }

  // ---------- exécution ----------
  const fmt = v => typeof v==="number" ? (Number.isInteger(v)?String(v):String(+v.toFixed(10)))
    : typeof v==="boolean" ? (v?"VRAI":"FAUX")
    : Array.isArray(v) ? "["+v.map(x=>typeof x==="string"?`"${x}"`:fmt(x)).join(", ")+"]"
    : v instanceof Set ? "{"+[...v].map(fmt).join(", ")+"}"
    : v===undefined ? "(rien)" : String(v);
  const tname = v => typeof v==="number"?"un nombre":typeof v==="boolean"?"un booléen":typeof v==="string"?"une chaîne":Array.isArray(v)?"un tableau":v instanceof Set?"un ensemble":"rien";
  const clone = v => Array.isArray(v) ? v.map(clone) : v;
  const parseInput = s => { s=String(s).trim(); if(/^-?\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(",",".")); const l=low(s); if(l==="vrai") return true; if(l==="faux") return false; return s.replace(/^"(.*)"$/,"$1"); };

  function run(prog, {inputs=[], vars={}, call=null, maxSteps=200000}={}){
    const out=[]; let steps=0, run=[], depth=0; const inQ=inputs.map(parseInput);
    const G=Object.create(null); for(const k in vars) G[low(k)]=clone(vars[k]);
    const tick=ln=>{ if(++steps>maxSteps) throw new PErr("Plus de 200 000 instructions exécutées : boucle infinie probable. La condition d'arrêt devient-elle vraiment vraie ? La variable est-elle modifiée dans la boucle ?",ln); };
    const num=(v,ln,op)=>{ if(typeof v!=="number") throw new PErr(`« ${op} » attend des nombres, mais reçoit ${tname(v)} (${fmt(v)})`,ln); return v; };
    const bool=(v,ln,what)=>{ if(typeof v!=="boolean") throw new PErr(`${what} doit valoir VRAI ou FAUX, mais vaut ${fmt(v)} (${tname(v)})`,ln); return v; };
    const eq=(a,b)=>typeof a==="number"&&typeof b==="number"?Math.abs(a-b)<1e-9:a===b;

    function ev(n,sc,ln){
      switch(n.t){
        case "lit": return n.v;
        case "list": return n.items.map(x=>ev(x,sc,ln));
        case "set": return new Set();
        case "var": { const k=low(n.name); if(!(k in sc)) throw new PErr(`La variable « ${n.name} » est utilisée avant d'avoir reçu une valeur (oubli d'initialisation ou de Lire ?)`,ln); return sc[k]; }
        case "idx": { const a=ev(n.a,sc,ln), i=ev(n.i,sc,ln);
          if(!Array.isArray(a)&&typeof a!=="string") throw new PErr(`On ne peut utiliser [ ] que sur un tableau, pas sur ${tname(a)}`,ln);
          if(typeof i!=="number"||!Number.isInteger(i)) throw new PErr(`Un indice doit être un entier (reçu : ${fmt(i)})`,ln);
          if(i<0||i>=a.length) throw new PErr(`Indice ${i} hors limites : le tableau a ${a.length} élément(s), indices valides de 0 à ${a.length-1}`,ln);
          return a[i]; }
        case "neg": return -num(ev(n.e,sc,ln),ln,"-");
        case "not": return !bool(ev(n.e,sc,ln),ln,"L'expression après NON");
        case "and": return bool(ev(n.l,sc,ln),ln,"Le côté gauche de ET") && bool(ev(n.r,sc,ln),ln,"Le côté droit de ET");
        case "or":  return bool(ev(n.l,sc,ln),ln,"Le côté gauche de OU") || bool(ev(n.r,sc,ln),ln,"Le côté droit de OU");
        case "in": { const s=ev(n.r,sc,ln), v=ev(n.l,sc,ln); if(s instanceof Set) return s.has(v); if(Array.isArray(s)) return s.some(x=>eq(x,v)); throw new PErr("« appartient à » attend un ensemble ou un tableau",ln); }
        case "bin": {
          const a=ev(n.l,sc,ln), b=ev(n.r,sc,ln), o=n.op;
          if(o==="="||o==="≠"){ const r=eq(a,b); return o==="="?r:!r; }
          if(o==="+"&&(typeof a==="string"||typeof b==="string")) return fmt(a)+fmt(b);
          if(["<",">","<=",">="].includes(o)){
            if(typeof a!==typeof b||(typeof a!=="number"&&typeof a!=="string")) throw new PErr(`Impossible de comparer ${tname(a)} et ${tname(b)} avec « ${o} »`,ln);
            return o==="<"?a<b:o===">"?a>b:o==="<="?a<=b:a>=b;
          }
          num(a,ln,o.toUpperCase()); num(b,ln,o.toUpperCase());
          if(o==="+") return a+b; if(o==="-") return a-b; if(o==="*") return a*b;
          if(b===0) throw new PErr(`Division par zéro (${fmt(a)} ${o==="/"?"/":o.toUpperCase()} 0)`,ln);
          if(o==="/") return a/b;
          if(o==="div") return Math.trunc(a/b);
          return a%b;
        }
        case "call": return callF(n,sc,ln,true);
      }
    }
    function callF(n,sc,ln,needVal){
      const k=low(n.name), args=n.args.map(x=>ev(x,sc,ln));
      const one=()=>{ if(args.length!==1) throw new PErr(`${n.name}() attend 1 paramètre`,ln); return args[0]; };
      if(k==="taille"||k==="longueur"){ const v=one(); if(Array.isArray(v)||typeof v==="string") return v.length; if(v instanceof Set) return v.size; throw new PErr(`${n.name}() attend un tableau ou une chaîne`,ln); }
      if(k==="abs") return Math.abs(num(one(),ln,"abs"));
      if(k==="racine") return Math.sqrt(num(one(),ln,"racine"));
      if(k==="ent"||k==="partie_entiere") return Math.floor(num(one(),ln,n.name));
      if(k==="arrondi"){ const d=args[1]||0; return Math.round(num(args[0],ln,"arrondi")*10**d)/10**d; }
      const f=prog.funcs[k];
      if(!f) throw new PErr(`Fonction « ${n.name} » inconnue (pas encore écrite, ou nom mal orthographié ?)`,ln);
      if(args.length!==f.params.length) throw new PErr(`« ${f.name} » attend ${f.params.length} paramètre(s) mais en reçoit ${args.length}`,ln);
      if(depth>=500) throw new PErr(`Trop d'appels imbriqués de « ${f.name} » (récursion sans fin ?)`,ln);
      depth++;
      const L=Object.create(null); f.params.forEach((p,i)=>L[low(p)]=args[i]);
      let val, returned=false;
      try{ exec(f.body,L); } catch(e){ if(e instanceof Ret){ val=e.v; returned=true; } else throw e; } finally { depth--; }
      if(needVal && (!returned||val===undefined)) throw new PErr(f.proc?`« ${f.name} » est une procédure : elle ne renvoie pas de valeur utilisable dans un calcul`:`La fonction « ${f.name} » s'est terminée sans « Retourner » une valeur`,ln);
      return val;
    }
    function assign(tg,v,sc,ln){
      if(tg.t==="var"){ sc[low(tg.name)]=v; return; }
      const a=ev(tg.a,sc,ln), i=ev(tg.i,sc,ln);
      if(!Array.isArray(a)) throw new PErr("On ne peut écrire T[i] ← … que sur un tableau",ln);
      if(typeof i!=="number"||!Number.isInteger(i)||i<0||i>=a.length) throw new PErr(`Indice ${fmt(i)} hors limites : indices valides de 0 à ${a.length-1}`,ln);
      a[i]=v;
    }
    function exec(body,sc){
      for(const s of body){
        tick(s.ln); const ln=s.ln;
        switch(s.t){
          case "assign": assign(s.tg,ev(s.e,sc,ln),sc,ln); break;
          case "print": {
            const txt=s.args.map(a=>fmt(ev(a,sc,ln))).join(" ").replace(/ {2,}/g," ").trim();
            out.push({text:txt,prompt:false}); if(out.length>3000) throw new PErr("Plus de 3000 lignes affichées : boucle infinie probable",ln);
            run.push({i:out.length-1, lit:s.args.every(a=>a.t==="lit"&&typeof a.v==="string")});
            break; }
          case "read":
            // Invites : le Afficher juste avant Lire, et les Afficher de texte seul qui le précèdent directement
            run.forEach((p,k)=>{ if(k===run.length-1 || p.lit) out[p.i].prompt=true; });
            for(const tg of s.tgs){
              if(!inQ.length) throw new PErr(`« Lire » ne trouve plus de donnée : ce test n'en fournit que ${inputs.length}. Lis-tu trop de valeurs, ou est-ce une boucle qui ne s'arrête pas ?`,ln);
              assign(tg,inQ.shift(),sc,ln);
            } break;
          case "ret": throw new Ret(s.e?ev(s.e,sc,ln):undefined);
          case "add": { const st=sc[low(s.set)]; if(st instanceof Set) st.add(ev(s.e,sc,ln)); else if(Array.isArray(st)) st.push(ev(s.e,sc,ln)); else throw new PErr(`« ${s.set} » n'est pas un ensemble (as-tu écrit ${s.set} ← ensemble vide ?)`,ln); break; }
          case "expr": callF(s.e,sc,ln,false); break;
          case "if": {
            let done=false;
            for(const b of s.br){ if(bool(ev(b.c,sc,ln),ln,"La condition du Si")){ exec(b.b,sc); done=true; break; } }
            if(!done&&s.els) exec(s.els,sc);
            break; }
          case "for": {
            const a=num(ev(s.a,sc,ln),ln,"Pour"), b=num(ev(s.b,sc,ln),ln,"Pour"), st=s.st?num(ev(s.st,sc,ln),ln,"pas"):1;
            if(st===0) throw new PErr("Un pas de 0 ne fait jamais avancer la boucle",ln);
            for(let v=a; st>0?v<=b+1e-9:v>=b-1e-9; v+=st){ tick(ln); sc[low(s.v)]=v; exec(s.body,sc); }
            break; }
          case "foreach": { const c=ev(s.e,sc,ln); if(!Array.isArray(c)&&!(c instanceof Set)) throw new PErr("« Pour chaque » attend un tableau ou un ensemble",ln);
            for(const v of [...c]){ tick(ln); sc[low(s.v)]=v; exec(s.body,sc); } break; }
          case "while": while(bool(ev(s.c,sc,ln),ln,"La condition du TantQue")){ tick(ln); exec(s.body,sc); } break;
          case "repeat": do{ tick(ln); exec(s.body,sc); } while(!bool(ev(s.c,sc,ln),ln,"La condition du Jusqu'à")); break;
        }
        if(s.t!=="print") run = [];
      }
    }
    let ret, err=null;
    try{
      if(call){ ret=callF(parseExpr(call,0),G,0,false); }
      else { try{ exec(prog.main,G); } catch(e){ if(!(e instanceof Ret)) throw e; } }
    } catch(e){ err={msg:e.message, ln:e.ln||null}; if(!(e instanceof PErr)) err.msg="Erreur interne : "+e.message; }
    return {out, ret, err, steps};
  }

  // ---------- correction ----------
  const normT = s => low(String(s)).replace(/(?<!\d)\.|\.(?!\d)/g," ").replace(/-(?!\d)/g," ").replace(/[^a-z0-9.\-]+/g," ").trim();
  const isNum = x => typeof x==="number" || /^-?\d+(\.\d+)?$/.test(String(x).trim());
  function lineOK(exp, act){
    if(isNum(exp)){ const ns=String(act).match(/-?\d+(?:\.\d+)?/g); return !!ns && Math.abs(parseFloat(ns[ns.length-1])-parseFloat(exp))<1e-6; }
    return normT(exp)===normT(act);
  }
  function valOK(exp, act){
    if(typeof exp==="number") return typeof act==="number" && Math.abs(exp-act)<1e-6;
    if(typeof exp==="boolean") return act===exp;
    return normT(fmt(exp))===normT(fmt(act));
  }
  function grade(src, tests){
    let prog;
    try{ prog=parse(src); } catch(e){ return {syntax:{msg:e.message,ln:e.ln}}; }
    const res = tests.map(t=>{
      const r=run(prog,{inputs:t.in||[],vars:t.vars||{},call:t.call||null});
      const shown=r.out.filter(o=>!o.prompt).map(o=>o.text);
      let ok=!r.err, why="";
      if(ok && t.out){ if(shown.length!==t.out.length){ ok=false; why=`${t.out.length} ligne(s) attendue(s), ${shown.length} affichée(s)`; } else { const k=t.out.findIndex((e,i)=>!lineOK(e,shown[i])); if(k>=0){ ok=false; why=`Ligne ${k+1} différente`; } } }
      if(ok && "ret" in t && !valOK(t.ret,r.ret)){ ok=false; why=`Valeur retournée : ${fmt(r.ret)} au lieu de ${fmt(t.ret)}`; }
      return {t, ok, why, shown, ret:r.ret, err:r.err};
    });
    return {res, prog};
  }
  return {parse, run, grade, fmt, low};
})();

 h:["Un compteur initialisé à 0.","Dans une boucle de 1 à N : si i MOD 2 = 0 alors compteur ← compteur + 1."],

{id:"mdp",cat:"boucles",d:1,t:"Mot de passe",must:"boucle",

{id:"somme0",cat:"boucles",d:2,t:"Somme jusqu'à 0",must:"boucle",
 q:"Écrire un algorithme qui demande des nombres à l'utilisateur jusqu'à ce qu'il saisisse 0, puis affiche la somme des nombres saisis (sans compter le 0).",
 spec:"Affiche uniquement la somme, à la fin.",
 h:["Lis un premier nombre AVANT la boucle, puis TantQue n ≠ 0.","Dans la boucle : ajoute n à la somme, puis lis le nombre suivant."],

{id:"diviseurs",cat:"boucles",d:2,t:"Diviseurs d'un nombre",must:"boucle",
 q:"Décomposition en facteurs : demander un entier positif et afficher ses diviseurs.",
 spec:"Affiche les diviseurs un par ligne, du plus petit au plus grand.",
 h:["d est un diviseur de n si n MOD d = 0.","Teste tous les d de 1 à n."],

   FinPour
Fin`},
{id:"interets",cat:"boucles",d:3,t:"Intérêts bancaires",must:"boucle",
 q:"Simulation d'intérêts bancaires : une personne dépose une somme sur un compte rémunéré à 3 % par an. Écrire un algorithme qui calcule le nombre d'années nécessaires pour atteindre un bénéfice de 2 000 € en plus de la somme.",
 spec:"Lis la somme de départ et affiche le nombre d'années.",
 h:["Chaque année : capital ← capital * 1.03","TantQue capital - somme < 2000 : on ajoute une année."],
 start:D0, tests:[{in:[10000],out:[7]},{in:[1000],out:[38]},{in:[50000],out:[2]}],
 s:`Début
   Lire somme
   capital ← somme
   annees ← 0
   TantQue capital - somme < 2000 Faire
      capital ← capital * 1.03

   FinTantQue
   Afficher annees
Fin`},
{id:"palindrome",cat:"boucles",d:3,t:"Nombre palindrome",must:"boucle",
 q:"Vérification d'un palindrome : demander un nombre entier et déterminer s'il se lit de la même manière de gauche à droite et de droite à gauche (exemple : 1221).",
 spec:"Affiche \"Palindrome\" ou \"Pas palindrome\".",
 h:["Construis le nombre inversé : n MOD 10 donne le dernier chiffre, n DIV 10 l'enlève.","inverse ← inverse * 10 + reste MOD 10, puis reste ← reste DIV 10, TantQue reste > 0. Compare ensuite inverse et n."],
 start:D0, tests:[{in:[1221],out:["Palindrome"]},{in:[123],out:["Pas palindrome"]},{in:[7],out:["Palindrome"]},{in:[10],out:["Pas palindrome"]},{in:[12321],out:["Palindrome"]}],
 s:`Début
   Lire n
   reste ← n
   inverse ← 0
   TantQue reste > 0 Faire
      inverse ← inverse * 10 + reste MOD 10
      reste ← reste DIV 10
   FinTantQue
   Si inverse = n Alors
      Afficher "Palindrome"
   Sinon
      Afficher "Pas palindrome"
   FinSi
Fin`},

{id:"pgcd",cat:"classiques",d:3,t:"PGCD (Euclide)",must:"boucle",
 q:"Lire a puis b, afficher leur PGCD avec la méthode d'Euclide.",
 h:["TantQue b ≠ 0 : on remplace (a, b) par (b, a MOD b).","Il faut une variable r pour ne pas perdre a MOD b : r ← a MOD b, a ← b, b ← r. À la fin, le PGCD est a."],
 start:D0, tests:[{in:[48,18],out:[6]},{in:[17,5],out:[1]},{in:[20,5],out:[5]},{in:[12,18],out:[6]}],
 s:`Début

{id:"premier",cat:"classiques",d:3,t:"Nombre premier",must:"boucle",
 q:'Lire n (≥ 2) et afficher "Premier" s\'il n\'est divisible que par 1 et lui-même, sinon "Pas premier".',

   Lire n

{id:"puiss",cat:"classiques",d:2,t:"Puissance",must:"boucle",

{id:"factrec",cat:"recursivite",d:2,t:"Factorielle récursive",must:"recursif",
 q:"Écrire la fonction récursive FactorielleRec(n) qui retourne n! (exemple du cours). Elle doit s'appeler elle-même.",
 h:["Cas de base : si n <= 1, retourner 1.","Appel récursif : Retourner n * FactorielleRec(n - 1)"],
 start:`Fonction FactorielleRec(n : entier) : entier
   
FinFonction`, tests:[{call:"FactorielleRec(5)",ret:120},{call:"FactorielleRec(1)",ret:1},{call:"FactorielleRec(0)",ret:1},{call:"FactorielleRec(7)",ret:5040}],
 s:`Fonction FactorielleRec(n : entier) : entier
   Si n <= 1 Alors
      Retourner 1
   FinSi
   Retourner n * FactorielleRec(n - 1)
FinFonction`},
{id:"sommerec",cat:"recursivite",d:2,t:"Somme récursive",must:"recursif",
 q:"Écrire la fonction récursive SommeRec(n) qui retourne 1 + 2 + … + n (et 0 si n = 0).",
 h:["Cas de base : n = 0 → 0.","SommeRec(n) = n + SommeRec(n - 1)"],
 start:`Fonction SommeRec(n : entier) : entier
   
FinFonction`, tests:[{call:"SommeRec(4)",ret:10},{call:"SommeRec(10)",ret:55},{call:"SommeRec(0)",ret:0}],
 s:`Fonction SommeRec(n : entier) : entier
   Si n = 0 Alors
      Retourner 0
   FinSi
   Retourner n + SommeRec(n - 1)
FinFonction`},
{id:"puissrec",cat:"recursivite",d:2,t:"Puissance récursive",must:"recursif",
 q:"Écrire la fonction récursive PuissanceRec(x, n) qui retourne x à la puissance n (n ≥ 0).",
 h:["x⁰ = 1 : c'est le cas de base.","xⁿ = x × xⁿ⁻¹"],
 start:`Fonction PuissanceRec(x : entier, n : entier) : entier
   
FinFonction`, tests:[{call:"PuissanceRec(2, 10)",ret:1024},{call:"PuissanceRec(5, 0)",ret:1},{call:"PuissanceRec(3, 3)",ret:27}],
 s:`Fonction PuissanceRec(x : entier, n : entier) : entier
   Si n = 0 Alors
      Retourner 1
   FinSi
   Retourner x * PuissanceRec(x, n - 1)
FinFonction`},
{id:"rebrec",cat:"recursivite",d:2,t:"Compte à rebours récursif",must:"recursif",
 q:"Écrire la procédure récursive Rebours(n) qui affiche n, n − 1, …, 1 (un par ligne), sans boucle.",
 h:["Cas de base : si n = 0, on ne fait rien.","Sinon : Afficher n, puis appeler Rebours(n - 1)."],
 start:`Procédure Rebours(n : entier)
   
FinProcédure`, tests:[{call:"Rebours(3)",out:[3,2,1]},{call:"Rebours(1)",out:[1]},{call:"Rebours(5)",out:[5,4,3,2,1]}],
 s:`Procédure Rebours(n : entier)
   Si n > 0 Alors
      Afficher n
      Rebours(n - 1)
   FinSi
FinProcédure`},
{id:"fibo",cat:"recursivite",d:3,t:"Suite de Fibonacci",must:"recursif",
 q:"Écrire la fonction récursive Fibonacci(n) : Fibonacci(0) = 0, Fibonacci(1) = 1, et ensuite Fibonacci(n) = Fibonacci(n − 1) + Fibonacci(n − 2).",
 h:["Il y a DEUX cas de base : n = 0 et n = 1 (ou : si n <= 1, Retourner n).","Deux appels récursifs dans la même ligne."],
 start:`Fonction Fibonacci(n : entier) : entier
   
FinFonction`, tests:[{call:"Fibonacci(0)",ret:0},{call:"Fibonacci(1)",ret:1},{call:"Fibonacci(10)",ret:55},{call:"Fibonacci(15)",ret:610}],

      Retourner n
   FinSi

FinFonction`},

{id:"promo",cat:"tableaux",d:3,t:"Atelier : notes de la promotion",must:"boucle",vars:"Notes",
 q:"Atelier pratique, dans un même algorithme.\nOn dispose d'un tableau Notes contenant les notes de plusieurs centaines ou milliers d'étudiants.\n- Calculer la moyenne de la promotion.\n- Trouver la meilleure et la moins bonne note.\n- Compter les étudiants admis (note ≥ 10).",
 spec:"Affiche 4 lignes : la moyenne, la meilleure note, la moins bonne note, puis le nombre d'admis. Notes est fourni par les tests.",
 h:["Un seul parcours suffit : somme, maximum, minimum et compteur se mettent à jour dans la même boucle.","Initialise maximum et minimum à Notes[0], somme et compteur à 0."],
 start:D0, tests:[{vars:{Notes:[12,15,8,17,14]},out:[13.2,17,8,4]},{vars:{Notes:[10,20]},out:[15,20,10,2]},{vars:{Notes:[6,9,3]},out:[6,9,3,0]}],
 s:`Début
   somme ← 0
   compteur ← 0
   maximum ← Notes[0]
   minimum ← Notes[0]
   Pour i ← 0 à taille(Notes) - 1 Faire
      somme ← somme + Notes[i]
      Si Notes[i] > maximum Alors
         maximum ← Notes[i]
      FinSi
      Si Notes[i] < minimum Alors
         minimum ← Notes[i]
      FinSi
      Si Notes[i] >= 10 Alors
         compteur ← compteur + 1
      FinSi
   FinPour
   Afficher "Moyenne :", somme / taille(Notes)
   Afficher "Meilleure note :", maximum
   Afficher "Moins bonne note :", minimum
   Afficher "Admis :", compteur
Fin`},

{id:"ca30",cat:"tableaux",d:3,t:"Atelier : chiffre d'affaires",must:"boucle",vars:"CA",

// ================== ASSISTANT (chatbot) ==================
// Deux moteurs, tous deux gratuits et sans serveur :
//  1. Assistant du cours (toujours actif) : recherche BM25 dans les leçons, la fiche, les flashcards
//     et les corrections du quiz ; exécute aussi le pseudo-code collé dans le message.
//  2. IA locale (optionnelle) : petit modèle Qwen exécuté dans le navigateur via WebLLM (WebGPU),
//     qui rédige sa réponse à partir des passages du cours trouvés par le moteur 1.
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";
const CHAT = { log: [], kb: null, idf: null, avgLen: 0, engine: null, model: null, loading: false, busy: false };

// ---------- base de connaissances ----------
const STOP = new Set("le la les un une des de du d l a au aux en est ce c ca cela que qui quoi quel quelle quels quelles dans pour par sur avec sans pas ne n se s son sa ses mon ma mes ton ta tes je tu il elle on nous vous ils elles me te y comment pourquoi quand combien faire fait fais veut dire explique expliquer moi peux peut svp stp entre plus moins tres bien marche fonctionne sert servir utilise utiliser qu quest cest ca".split(" "));
const SYN = { while:"tantque", for:"pour", if:"si", else:"sinon", function:"fonction", procedure:"fonction", array:"tableau", list:"tableau", liste:"tableau", sort:"tri", trier:"tri", bubble:"bulle", recursion:"recursif", recursivite:"recursif", recursive:"recursif", loop:"boucle", modulo:"mod", reste:"mod", fleche:"affectation" };
function toks(s){
  return PC.low(String(s)).replace(/tant\s*que/g,"tantque").replace(/jusqu\W?\s*a/g,"jusqua").replace(/fin\s*(si|pour|tantque)/g,"fin$1")
    .split(/[^a-z0-9]+/).filter(w=>w && !STOP.has(w)).map(w=>{
      w = SYN[w] || w;
      if(w.startsWith("recurs")) return "recurs";
      if(w.length>4) w = w.replace(/(ements?|ations?|iques?|ites?|ives?|ifs?|eurs?|es|s|x|e)$/,"");
      return w;
    });
}
const htmlText = h => h.replace(/<[^>]+>/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();
const cleanHtml = h => h.replace(/<div data-trace="[^"]*"><\/div>/g,`<p class="note">▶️ L'exécution pas à pas est dans la leçon.</p>`).replace(/<div data-widget="tt"><\/div>/g,"");

function buildKB(){
  const kb = [];
  const add = (o, w=1) => { o.tt = new Set(toks(o.title)); o.t = toks(o.title).concat(toks(o.title), toks(o.text)); o.w = w; kb.push(o); };
  LESSONS.forEach(l=>{
    l.html.split(/(?=<h3>)/).forEach((p,i)=>{
      if(htmlText(p).length < 30) return; // morceau vide (leçon qui commence par un sous-titre)
      const h = (p.match(/^<h3>(.*?)<\/h3>/)||[])[1];
      add({kind:"lecon", title:l.title + (h ? " — " + htmlText(h) : ""), html:cleanHtml(p), text:htmlText(p), lesson:l.id}, i===0?1.15:1);
    });
  });
  FICHE.split(/(?=<div class="card">)/).filter(c=>c.startsWith('<div class="card">')).forEach(card=>{
    const h = htmlText((card.match(/<h3>(.*?)<\/h3>/)||[])[1]||"");
    add({kind:"fiche", title:"Fiche résumé — "+h, html:card.replace(/^<div class="card">/,"").replace(/<\/div>\s*(<\/div>\s*)?$/,""), text:htmlText(card)}, 1.1);
  });
  FLASH.forEach(([q,a])=>add({kind:"flash", title:q, html:a, text:htmlText(a)}, 1.05));
  QB.forEach(q=>{
    const good = q.t==="qcm"?q.ch[q.a]:q.t==="vf"?(q.a?"Vrai":"Faux"):q.a[0];
    add({kind:"quiz", title:q.q, html:`<p><b>${esc(good)}</b></p>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}<p>${q.e}</p>`, text:q.q+" "+good+" "+htmlText(q.e)}, 0.7);
  });
  const df = {};
  kb.forEach(d=>{ new Set(d.t).forEach(w=>df[w]=(df[w]||0)+1); });
  CHAT.idf = w => Math.log(1 + (kb.length - (df[w]||0) + .5) / ((df[w]||0) + .5));
  CHAT.avgLen = kb.reduce((s,d)=>s+d.t.length,0)/kb.length;
  CHAT.kb = kb;
}
function search(query, n=5){
  if(!CHAT.kb) buildKB();
  const qt = [...new Set(toks(query))];
  if(!qt.length) return [];
  return CHAT.kb.map(d=>{
    const tf = {}; d.t.forEach(w=>tf[w]=(tf[w]||0)+1);
    let s = 0;
    for(const w of qt){ const f = tf[w]||0; if(f) s += CHAT.idf(w) * f*2.2 / (f + 1.2*(.25 + .75*d.t.length/CHAT.avgLen)); }
    const cover = qt.filter(w=>d.tt.has(w)).length / qt.length; // bonus si la question correspond au titre
    return {d, s: s*d.w*(1 + cover)};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,n);
}

// ---------- pseudo-code collé dans le message ----------
function looksLikeCode(m){ return m.includes("\n") && /(←|<-|^\s*(afficher|lire|si\s.+\salors|pour\s|tant\s*que|fonction\s|début|debut)\b)/im.test(m); }
function runSnippet(m){
  let prog;
  try{ prog = PC.parse(m); } catch(e){ return {html:`<div class="errbox">⚠️ ${e.ln?`Ligne ${e.ln} : `:""}${esc(e.message)}</div>`, text:`erreur d'écriture ligne ${e.ln} : ${e.message}`}; }
  const r = PC.run(prog,{});
  const out = r.out.map(o=>o.text);
  const needsRead = r.err && /Lire/.test(r.err.msg);
  const html = `<div class="out">${out.length?esc(out.join("\n")):"<span class='pr'>(rien d'affiché)</span>"}</div>`
    + (needsRead ? `<p class="note">Ton code utilise <code>Lire</code> : je ne peux pas deviner les valeurs. Teste-le dans la console de l'<a onclick="go('exos')">Atelier code</a>.</p>`
      : r.err ? `<div class="errbox">⚠️ ${r.err.ln?`Ligne ${r.err.ln} : `:""}${esc(r.err.msg)}</div>` : `<p class="note">✅ Le code s'exécute sans erreur.</p>`);
  return {html, text:`affichage : ${out.join(" | ")||"rien"}${r.err?` ; erreur ligne ${r.err.ln} : ${r.err.msg}`:" ; aucune erreur"}`};
}

// ---------- réponses de l'assistant du cours ----------
const SMALL = [
  [/^(salut|bonjour|hello|coucou|hey|yo|bonsoir)\b/i, "Salut ! 👋 Pose-moi une question sur le cours (variables, conditions, boucles, tableaux, récursivité, tris, fonctions…) ou colle ton pseudo-code pour que je l'exécute."],
  [/^(merci|thanks|super|top|parfait|cool)\b/i, "Avec plaisir ! Une autre question ?"],
  [/^(qui es[- ]tu|tu es qui|t'es qui)/i, "Je suis l'assistant d'AlgoMaster. Je réponds à partir du cours et j'exécute ton pseudo-code. Active l'IA pour des réponses rédigées."],
];
function courseAnswer(m, hits){
  for(const [re,txt] of SMALL) if(re.test(m.trim())) return `<p>${txt}</p>`;
  if(!hits.length || hits[0].s < 2.5) return `<p>Je n'ai rien trouvé de clair dans le cours pour ça. Essaie avec les mots du cours (ex : « boucle TantQue », « tri à bulles », « cas de base »)${CHAT.engine?"":", ou active l'IA"}.</p>`;
  const best = hits[0].d;
  const others = hits.slice(1).filter(h=>h.s > hits[0].s*0.45 && h.d.title!==best.title).slice(0,3);
  const label = {lecon:"Dans la leçon", fiche:"Dans la fiche résumé", flash:"Flashcard", quiz:"Correction du quiz"}[best.kind];
  return `<p class="lbl">${label} : <b>${esc(best.title)}</b></p><div class="chat-src">${best.html}</div>
    ${best.lesson?`<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="go('cours','${best.lesson}')">📚 Ouvrir la leçon</button></div>`:""}
    ${others.length?`<p class="lbl" style="margin-top:10px">Voir aussi :</p><div class="row">${others.map(h=>`<button class="chip" data-q="${esc(h.d.title)}">${esc(h.d.title.length>60?h.d.title.slice(0,58)+"…":h.d.title)}</button>`).join("")}</div>`:""}`;
}

// ---------- IA locale (WebLLM) ----------
async function enableAI(){
  if(CHAT.engine || CHAT.loading) return;
  if(!navigator.gpu){ $("#ai-status").innerHTML = `<span class="er">Ton navigateur ne gère pas WebGPU, nécessaire à l'IA locale. Essaie Chrome ou Edge récent sur ordinateur. L'assistant du cours reste disponible.</span>`; return; }
  CHAT.loading = true; drawAIBar();
  try{
    const adapter = await navigator.gpu.requestAdapter();
    if(!adapter) throw new Error("aucune carte graphique compatible WebGPU trouvée");
    const f16 = adapter.features.has("shader-f16");
    const small = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.deviceMemory && navigator.deviceMemory <= 4);
    const webllm = await import(WEBLLM_URL);
    const ids = webllm.prebuiltAppConfig.model_list.map(m=>m.model_id);
    const want = `Qwen2.5-${small?"0.5":"1.5"}B-Instruct-q4f${f16?16:32}_1-MLC`;
    CHAT.model = ids.includes(want) ? want : ids.find(i=>/^Qwen2\.5-.*Instruct-q4f32_1-MLC$/.test(i));
    CHAT.engine = await webllm.CreateMLCEngine(CHAT.model, { initProgressCallback: p => {
      const el = $("#ai-status"); if(el) el.innerHTML = `<div class="bar"><i style="width:${Math.round((p.progress||0)*100)}%"></i></div><small>${esc(p.text||"")}</small>`;
    }});
  } catch(e){
    CHAT.engine = null; CHAT.loading = false; drawAIBar();

const SYSTEM = `Tu es le tuteur d'AlgoMaster, un cours d'algorithmique pour grands débutants (école Sup De Vinci).
Réponds en français, simplement, en 3 à 8 phrases maximum, avec un petit exemple si utile.
Utilise la syntaxe de pseudo-code du cours : affectation avec ←, Lire, Afficher, Si … Alors … Sinon … FinSi, Pour i allant de a à b Faire … FinPour, TantQue … Faire … FinTantQue, Répéter … Jusqu'à …, Fonction Nom(param) : type … Retourner … FinFonction, MOD, DIV, ET, OU, NON, VRAI, FAUX. Les tableaux commencent à l'indice 0.

Ne donne pas directement la solution complète d'un exercice : donne des pistes, sauf si l'élève la demande explicitement.`;
async function aiAnswer(m, hits, runInfo, el){
  const ctx = hits.slice(0,3).map(h=>`### ${h.d.title}\n${h.d.text.slice(0,700)}`).join("\n\n");
  const hist = CHAT.log.filter(x=>x.plain).slice(-6).map(x=>({role:x.role, content:x.plain}));
  const user = `Extraits du cours :\n${ctx||"(aucun extrait trouvé)"}\n${runInfo?`\nRésultat de l'exécution du code de l'élève : ${runInfo}\n`:""}\nQuestion de l'élève : ${m}`;
  let txt = "";
  const chunks = await CHAT.engine.chat.completions.create({messages:[{role:"system",content:SYSTEM}, ...hist, {role:"user",content:user}], stream:true, temperature:0.3, max_tokens:600});
  for await (const c of chunks){ txt += c.choices[0]?.delta?.content || ""; el.innerHTML = md(txt) + `<span class="cursor">▍</span>`; scrollChat(); }
  return txt;
}
function md(s){
  const blocks = [];
  s = s.replace(/```[a-z]*\n?([\s\S]*?)(```|$)/g,(_,c)=>{ blocks.push(c.replace(/\n$/,"")); return `\u0000${blocks.length-1}\u0000`; });
  s = esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.*)$/gm,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n/g,"<br>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre class="code">${esc(blocks[i])}</pre>`);
}

function hl(code){
  return code.split("\n").map(line=>{
    let out="", re=/("[^"]*")|(\/\/.*$)|(\d+(?:\.\d+)?)|([A-Za-zÀ-ÿ_']+)|([^"\/\dA-Za-zÀ-ÿ_']+|\/)/g, m;

let QZ = null;
function buildPool(cats, n, withGen){
  const stat = shuffle(QB.filter(q=>cats.includes(q.c)));
  // on privilégie les questions jamais vues
  stat.sort((a,b)=>(S.seen[qkey(a)]||0)-(S.seen[qkey(b)]||0));
  const gens = GENS.map(g=>g).filter(g=>{ try{ return cats.includes(g().c); }catch{return false;} });
  const out = []; let si = 0; const used = new Set();
  let guard = 0;
  while(out.length<n && guard++<n*20){
    const useGen = withGen && gens.length && (si>=stat.length || Math.random()<0.4);
    let q;
    if(useGen){ q = pick(gens)(); } else if(si<stat.length){ q = stat[si++]; } else break;
    const k = qkey(q); if(used.has(k)) continue; used.add(k); out.push(q);
  }
  return shuffle(out);
}

  <label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin-top:24px"><input type="checkbox" id="gen" ${saved.gen?"checked":""} style="accent-color:var(--acc);width:18px;height:18px"> Inclure des questions générées aléatoirement (valeurs différentes à chaque fois)</label></div>
  <div style="margin-top:24px"><button class="btn" onclick="launchFromSetup()">▶ Lancer le quiz</button></div></div>
  <h2>Quiz express par thème</h2><div class="grid g3">${Object.entries(CATS).map(([k,c])=>{const st=S.stats[k];return `<div class="card click" onclick="startQuiz(['${k}'],10,true,'${esc(c.name)}')"><h3>${c.icon} ${c.name}</h3><small style="color:var(--mut)">${st?`${st.ok}/${st.n} bonnes réponses`:"Pas encore tenté"}</small></div>`;}).join("")}</div>`);
  document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
}
function launchFromSetup(){
  const cats=[...document.querySelectorAll(".cat-pick input:checked")].map(i=>i.value);
  if(!cats.length) return toast("Choisis au moins une catégorie");
  const n=+$("#seg .on").dataset.n, gen=$("#gen").checked;
  try{ localStorage.setItem(KEY+"_qs", JSON.stringify({cats,n,gen})); }catch{}
  startQuiz(cats,n,gen,cats.length===1?CATS[cats[0]].name:"Quiz personnalisé");
}
function startQuiz(cats, n, withGen, title, opts={}){
  const qs = opts.qs || buildPool(cats, n, withGen);
  if(!qs.length) return toast("Aucune question disponible");
  QZ = {qs, i:0, ok:0, log:[], title, exam:!!opts.exam, errorsMode:!!opts.errorsMode, start:Date.now()};
  if(view!=="quiz" && view!=="exam" && view!=="errors"){ view="quiz"; renderSide(); }
  if(opts.time){ startTimer(opts.time); }
  showQ();
}
function startTimer(sec){
  const end = Date.now()+sec*1000;
  const id = setInterval(()=>{
    const el=$("#timer"); const r=Math.max(0,Math.round((end-Date.now())/1000));
    if(el){ el.textContent=`⏱ ${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`; el.classList.toggle("low",r<120); }
    if(r<=0){ clearInterval(id); stopTimer=null; toast("⏰ Temps écoulé !"); finishQuiz(); }
  },500);
  stopTimer = ()=>clearInterval(id);
}
function showQ(){
  const q = QZ.qs[QZ.i], n = QZ.qs.length;
  QZ.answered = false;
  let body = "";
  if(q.t==="qcm"){
    QZ.order = shuffle(q.ch.map((_,j)=>j));
    body = `<div class="choices">${QZ.order.map((j,k)=>`<button class="choice" data-j="${j}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.ch[j])}</span></button>`).join("")}</div>`;
  } else if(q.t==="vf"){
    QZ.order = [1,0];
    body = `<div class="choices" style="grid-template-columns:1fr 1fr"><button class="choice" data-j="1"><span class="k">V</span>Vrai</button><button class="choice" data-j="0"><span class="k">F</span>Faux</button></div>`;
  } else {
    body = `<div class="qinput"><input id="ans" placeholder="Ta réponse…" autocomplete="off"><button class="btn" id="valid">Valider</button></div>`;
  }
  page(`<div class="qhead"><span>${esc(QZ.title)} · ${CATS[q.c].icon} ${CATS[q.c].name}</span><span class="row">${QZ.exam?`<span class="timer" id="timer">⏱</span>`:""}<b style="color:var(--txt)">${QZ.i+1} / ${n}</b> · ✅ ${QZ.ok}</span></div>
  <div class="qprog"><i style="width:${100*QZ.i/n}%"></i></div>
  <div class="qcard"><span class="pill">${q.t==="qcm"?"QCM":q.t==="vf"?"Vrai ou Faux":"Réponse libre"}</span>${q.gen?` <span class="pill c1">🎲 générée</span>`:""}
  <div class="qtext">${esc(q.q)}</div>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}${body}<div id="fb"></div></div>
  <p class="kbd-hint" style="text-align:center;color:var(--mut);font-size:13px;margin-top:14px">Raccourcis : ${q.t==="in"?"<span class='kbd'>Entrée</span> valider":q.t==="vf"?"<span class='kbd'>V</span> / <span class='kbd'>F</span>":"<span class='kbd'>A</span>-<span class='kbd'>D</span> ou <span class='kbd'>1</span>-<span class='kbd'>4</span>"} · <span class="kbd">Entrée</span> question suivante · <button class="btn ghost sm" onclick="ask('Arrêter le quiz et voir les résultats ?',finishQuiz,'Terminer')">Terminer maintenant</button></p>`);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  if(q.t==="in"){ const inp=$("#ans"); inp.focus(); $("#valid").onclick=()=>answer(inp.value); }
}
function answer(given){
  if(QZ.answered) return; QZ.answered = true;
  const q = QZ.qs[QZ.i]; let ok, goodTxt;
  if(q.t==="qcm"){ ok = given===q.a; goodTxt = q.ch[q.a]; }
  else if(q.t==="vf"){ ok = (given===1)===q.a; goodTxt = q.a?"Vrai":"Faux"; }
  else { if(!String(given).trim()){ QZ.answered=false; return; } ok = q.a.some(a=>norm(a)===norm(given)); goodTxt = q.a[0]; }
  // visuel
  if(q.t!=="in"){
    const goodJ = q.t==="qcm"? q.a : (q.a?1:0);
    document.querySelectorAll(".choice").forEach(b=>{ const j=+b.dataset.j; b.classList.add("lock"); if(j===goodJ) b.classList.add("good"); else if(j===given) b.classList.add("bad"); else b.classList.add("dim"); });
  } else { const inp=$("#ans"); inp.disabled=true; inp.classList.add(ok?"good":"bad"); $("#valid").remove(); }
  // stats
  const st = S.stats[q.c] || (S.stats[q.c]={n:0,ok:0}); st.n++; S.answered++;
  const k = qkey(q); S.seen[k]=(S.seen[k]||0)+1;
  if(ok){ st.ok++; S.correct++; QZ.ok++; S.xp+=q.gen?3:2; S.errors = S.errors.filter(e=>qkey(e)!==k); }
  else if(!S.errors.some(e=>qkey(e)===k)) S.errors.push(q);
  save(); renderSide();
  QZ.log.push({q, ok, given: q.t==="qcm"?q.ch[given]:q.t==="vf"?(given?"Vrai":"Faux"):given, good:goodTxt});
  const last = QZ.i===QZ.qs.length-1;
  $("#fb").innerHTML = `<div class="fb ${ok?"good":"bad"}"><h4>${ok?pick(["✅ Bonne réponse !","✅ Exact !","✅ Bravo !","✅ Parfait !"]):"❌ Pas tout à fait…"}</h4>
  ${ok?"":`<p>La bonne réponse était : <b>${esc(goodTxt)}</b></p>`}<p>📖 <b>Correction :</b> ${q.e}</p>
  <div style="margin-top:12px"><button class="btn" id="nextb">${last?"Voir mes résultats 🏁":"Question suivante →"}</button></div></div>`;
  $("#nextb").onclick = nextQ; $("#nextb").focus();
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){ if(QZ.i<QZ.qs.length-1){ QZ.i++; showQ(); } else finishQuiz(); }
function finishQuiz(){
  if(stopTimer){ stopTimer(); stopTimer=null; }
  const done = QZ.log.length, total = QZ.qs.length, p = total?Math.round(100*QZ.ok/total):0;
  const note = Math.round(20*QZ.ok/total*2)/2;
  if(QZ.exam){ S.exams.push({date:new Date().toLocaleDateString("fr-FR"), note}); save(); }
  if(p===100 && total>=5) { S.xp+=20; save(); renderSide(); }
  const col = p>=80?"var(--ok)":p>=50?"var(--warn)":"var(--ko)";
  const msg = p===100?"Parfait ! Tu maîtrises 🔥":p>=80?"Excellent travail ! 💪":p>=60?"Bien ! Encore un petit effort 👍":p>=40?"Pas mal, revois les points faibles 📖":"Courage ! Relis le cours puis réessaie 🌱";
  const cats=[...new Set(QZ.qs.map(q=>q.c))], title=QZ.title, exam=QZ.exam;
  page(`<h1>🏁 Résultats — ${esc(title)}</h1>
  <div class="card" style="text-align:center"><div class="score-ring" style="background:conic-gradient(${col} ${p*3.6}deg, var(--card2) 0)"><div><span><b>${QZ.ok}/${total}</b><small style="color:var(--mut)">${p} %</small></span></div></div>
  ${exam?`<h2 style="margin:0">Note : ${note} / 20</h2>`:""}<p style="font-size:18px">${msg}</p>${done<total?`<p class="sub">${total-done} question(s) non répondue(s).</p>`:""}
  <div class="row" style="justify-content:center"><button class="btn" id="again">🔄 Recommencer (nouvelles questions)</button>${QZ.log.some(l=>!l.ok)?`<button class="btn ghost" onclick="go('errors')">🔁 Revoir mes erreurs</button>`:""}<button class="btn ghost" onclick="go('home')">🏠 Accueil</button></div></div>
  <h2>Correction détaillée</h2>${QZ.log.map((l,i)=>`<div class="review-item ${l.ok?"":"bad"}"><small>${i+1}. ${CATS[l.q.c].name}</small><div><b>${esc(l.q.q)}</b></div>${l.q.code?`<pre class="code">${esc(l.q.code)}</pre>`:""}
  <div>${l.ok?"✅":"❌"} Ta réponse : <b>${esc(l.given)}</b>${l.ok?"":` · Bonne réponse : <b style="color:var(--ok)">${esc(l.good)}</b>`}</div><div style="color:var(--mut);margin-top:4px">${l.q.e}</div></div>`).join("")}`);
  $("#again").onclick = () => exam ? examStart() : startQuiz(cats, total, true, title);
}

let exoFilter = "all", EX = null;
const MUST = {
  boucle:[/^\s*(pour|tant\s*que|repeter)\b/m, "Cet exercice demande d'utiliser une boucle (Pour, TantQue ou Répéter) : afficher les valeurs « à la main » ne compte pas !"],
  si:[/^\s*si\b/m, "Cet exercice demande d'utiliser une condition (Si … Alors)."],
  fonction:[/^\s*(fonction|procedure)\b/m, "Cet exercice demande d'écrire une Fonction / Procédure."],
  // récursif : une fonction dont le corps contient un appel à elle-même
  recursif:[{test:code=>{
    const re=/^\s*(?:fonction|procedure)\s+(\w+)\s*\(/gm; let m;
    while((m=re.exec(code))){
      const rest=code.slice(re.lastIndex), end=rest.search(/^\s*fin\s*(fonction|procedure)/m);
      if(new RegExp("\\b"+m[1]+"\\s*\\(").test(end<0?rest:rest.slice(0,end))) return true;
    }
    return false; }}, "Cet exercice demande une version RÉCURSIVE : ta fonction doit s'appeler elle-même (pas de boucle à la place)."],
};

const testLabel = t => t.call ? `Appel : <code>${esc(t.call)}</code>` :
  [t.vars?Object.entries(t.vars).map(([k,v])=>`<code>${k} = ${esc(PC.fmt(v))}</code>`).join(" "):"", t.in&&t.in.length?`Entrées (Lire) : <code>${t.in.map(esc).join(", ")}</code>`:""].filter(Boolean).join(" · ") || "Aucune entrée";
const testExp = t => t.out ? t.out.map(x=>esc(x)).join(" ⏎ ") : esc(PC.fmt(t.ret));
const skeleton = s => s.split("\n").map(l=>{
  const ind=l.match(/^\s*/)[0], t=l.trim(), n=PC.low(t);
  if(/^(debut|fin|sinon|finsi|finpour|fintantque|repeter|finfonction|finprocedure)$/.test(n) || /^(fonction|procedure)\b/.test(n) || /^lire\b/.test(n) || !t) return l;
  if(/^sinon si\b/.test(n)) return ind+"Sinon Si … Alors";
  if(/^si\b/.test(n)) return ind+"Si … Alors";
  if(/^pour chaque\b/.test(n)) return ind+"Pour chaque … dans …";
  if(/^pour\b/.test(n)) return ind+"Pour … allant de … à … Faire";
  if(/^tant/.test(n)) return ind+"TantQue … Faire";
  if(/^jusqu/.test(n)) return ind+"Jusqu'à …";
  if(/^afficher\b/.test(n)) return ind+"Afficher …";
  if(/^retourner\b/.test(n)) return ind+"Retourner …";
  if(/^ajouter\b/.test(n)) return ind+"Ajouter … à …";
  if(t.includes("←")) return ind+t.split("←")[0].trim()+" ← …";
  return ind+"…";
}).join("\n");

}

  <div id="hints"></div>

      <div class="ed-wrap"><div class="gutter" id="gut"></div><textarea id="ed" spellcheck="false" autocomplete="off"></textarea></div>
      <div class="row" style="margin-top:12px"><button class="btn ok" id="checkb">✅ Corriger <span class="kbd" style="color:#d1fae5">Ctrl+Entrée</span></button><button class="btn ghost" id="runb">▶ Exécuter</button><button class="btn ghost sm" id="resetb">↺ Recommencer</button></div>
      <p class="note" style="margin-top:8px">Astuce : tape <code>&lt;-</code> pour obtenir <code>←</code>. <span class="kbd">Tab</span> indente, l'indentation suit automatiquement après Alors / Faire / Sinon / Répéter.</p>
    </div>
    <div>
      <div class="card" id="res"></div>
      <div class="card" style="margin-top:14px"><b>🖥️ Console</b> <small style="color:var(--mut)">— teste librement avec tes propres valeurs</small>
      ${e.tests[0].call?"":`<input id="inp" placeholder="Valeurs pour Lire, séparées par des virgules (ex : 12, 16)" value="${esc((e.tests[0].in||[]).join(", "))}">`}
      <div class="out" id="cons" style="margin-top:8px"><span class="pr">Clique sur ▶ Exécuter pour lancer ton code.</span></div></div>
    </div>
  </div>`);
  $("#main .wrap").style.maxWidth = "1280px";
  const ta = $("#ed");
  ta.value = S.code[id] ?? e.start;
  renderTests(null);
  gutter();

  // ---- éditeur
  let saveT;
  ta.addEventListener("input", ()=>{
    const p = ta.selectionStart;
    if(ta.value.slice(p-2,p)==="<-"){ ta.setRangeText("←",p-2,p,"end"); }
    S.code[id] = ta.value; clearTimeout(saveT); saveT = setTimeout(save, 400);
    gutter();
  });
  ta.addEventListener("scroll", ()=>{ $("#gut").scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", ev=>{
    if(ev.key==="Enter" && (ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); check(); return; }
    if(ev.key==="Tab"){
      ev.preventDefault();
      const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1;
      if(ev.shiftKey){ const m = ta.value.slice(ls).match(/^ {1,3}/); if(m){ ta.setRangeText("", ls, ls+m[0].length, "end"); } }
      else ta.setRangeText("   ", s, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input")); return;
    }
    if(ev.key==="Enter"){
      ev.preventDefault();
      const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1, line = ta.value.slice(ls, s);
      let ind = line.match(/^\s*/)[0]; const n = PC.low(line.trim());
      if(/(alors|faire|sinon|repeter|debut)\s*:?$/.test(n) || /^(fonction|procedure|pour chaque)\b/.test(n)) ind += "   ";
      ta.setRangeText("\n"+ind, s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input"));
    }
  });
  const insert = (txt, isSnip) => {
    const s = ta.selectionStart, ls = ta.value.lastIndexOf("\n", s-1)+1, ind = ta.value.slice(ls, s).match(/^\s*/)[0];
    const t = isSnip ? txt.split("\n").join("\n"+ind) : (/^[A-Z]/.test(txt)?` ${txt} `:txt);
    ta.setRangeText(t, s, ta.selectionEnd, "end");
    const k = ta.value.indexOf("…", s);
    if(isSnip && k>=0 && k < s+t.length) ta.setSelectionRange(k, k+1);
    ta.focus(); ta.dispatchEvent(new Event("input"));
  };
  document.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>insert(b.dataset.ins,false));
  document.querySelectorAll("[data-snip]").forEach(b=>b.onclick=()=>insert(b.dataset.snip,true));

  // ---- boutons
  $("#checkb").onclick = check;
  $("#runb").onclick = runConsole;
  $("#resetb").onclick = () => ask("Effacer ton code et revenir au code de départ ?", ()=>{ ta.value = e.start; ta.dispatchEvent(new Event("input")); renderTests(null); }, "Recommencer");
  $("#hintb").onclick = () => {
    if(EX.hint >= hints.length) return;
    const h = hints[EX.hint++];
    $("#hints").insertAdjacentHTML("beforeend", h==="__skel"
      ? `<div class="box tip" style="margin:10px 0 0"><b class="t">💡 Indice ${EX.hint} — le squelette de la solution</b>Complète les « … » :<pre class="code">${esc(skeleton(e.s))}</pre></div>`
      : `<div class="box warn" style="margin:10px 0 0"><b class="t">💡 Indice ${EX.hint}</b>${h}</div>`);
    enhance();
    $("#hintb").textContent = `💡 Indice (${EX.hint}/${hints.length})`;
    if(EX.hint >= hints.length) $("#hintb").disabled = true;
  };
  $("#solb").onclick = () => {
    if(!S.solved[id] && EX.tries < 1 && !EX.forceSol) return ask("Tu n'as pas encore essayé de corriger ton code.\nVoir quand même la correction ?", ()=>{ EX.forceSol=true; $("#solb").click(); }, "Voir la correction");
    $("#sol").innerHTML = `<div class="box def" style="margin:12px 0 0"><b class="t">📖 Correction</b><pre class="code">${esc(e.s)}</pre>
    <p style="margin:0" class="note">Il existe souvent plusieurs bonnes solutions : si tes tests passent, ta version est valable !</p>
    <button class="btn ghost sm" style="margin-top:8px" id="copysol">Copier dans l'éditeur</button></div>`;
    enhance();
    $("#copysol").onclick = () => ask("Remplacer ton code par la correction ?", ()=>{ ta.value = e.s; ta.dispatchEvent(new Event("input")); }, "Remplacer");
  };

  function gutter(errLn){
    const n = ta.value.split("\n").length;
    $("#gut").innerHTML = Array.from({length:n},(_,k)=>`<div class="${k+1===errLn?"err":""}">${k+1}</div>`).join("");
    $("#gut").scrollTop = ta.scrollTop;
  }
  function goLine(ln){
    if(!ln) return;
    const lines = ta.value.split("\n"); let st = 0;
    for(let k=0;k<ln-1 && k<lines.length;k++) st += lines[k].length+1;
    ta.focus(); ta.setSelectionRange(st, st+(lines[ln-1]||"").length);
    ta.scrollTop = Math.max(0,(ln-4)*22.4); gutter(ln);
  }
  window.exoGoLine = goLine;
  const errHtml = er => `<div class="errbox">⚠️ ${er.ln?`<a onclick="exoGoLine(${er.ln})">Ligne ${er.ln}</a> : `:""}${esc(er.msg)}</div>`;

  function renderTests(g){
    const res = g && g.res;
    $("#res").innerHTML = `<b>🧪 Tests (${e.tests.length})</b>${res?` <span style="float:right;font-weight:700;color:${res.every(r=>r.ok)?"var(--ok)":"var(--ko)"}">${res.filter(r=>r.ok).length}/${res.length} réussis</span>`:` <small style="color:var(--mut)">— clique sur Corriger</small>`}
    ${e.tests.map((t,k)=>{ const r = res&&res[k];
      return `<div class="test ${r?(r.ok?"ok":"ko"):""}"><div class="row" style="justify-content:space-between"><span class="lbl">Test ${k+1}</span><span>${r?(r.ok?"✅":"❌"):"⏳"}</span></div>
      <div>${testLabel(t)}</div><div>Attendu : <code>${testExp(t)}</code></div>
      ${r&&!r.ok?`${r.err?errHtml(r.err):`<div>Obtenu : <code style="color:#fca5a5">${t.out?(r.shown.length?r.shown.map(esc).join(" ⏎ "):"(rien d'affiché)"):esc(PC.fmt(r.ret))}</code></div><div class="lbl">${esc(r.why)}</div>`}`:""}</div>`; }).join("")}`;
  }

  function check(){
    EX.tries++;
    const code = ta.value, g = PC.grade(code, e.tests);
    if(g.syntax){
      gutter(g.syntax.ln);
      $("#res").innerHTML = `<b>🧪 Correction</b><div class="errbox" style="margin-top:10px"><b>❌ Erreur d'écriture</b> — ton code ne peut pas être lu.<br>${g.syntax.ln?`<a onclick="exoGoLine(${g.syntax.ln})">Ligne ${g.syntax.ln}</a> : `:""}${esc(g.syntax.msg)}</div>
      <p class="note">Vérifie l'orthographe des mots-clés (Si … Alors, FinSi, Pour … Faire, FinPour, TantQue … Faire, FinTantQue, Répéter / Jusqu'à) et que chaque bloc ouvert est bien fermé.</p>`;
      return;
    }
    gutter();
    renderTests(g);
    const firstErr = g.res.find(r=>r.err); if(firstErr) gutter(firstErr.err.ln);
    const allOk = g.res.every(r=>r.ok);
    const must = e.must && MUST[e.must], mustOk = !must || must[0].test(PC.low(code));
    if(allOk && !mustOk){ $("#res").insertAdjacentHTML("beforeend", `<div class="errbox">⚠️ Les tests passent, mais : ${must[1]}</div>`); return; }
    if(allOk){
      const first = !S.solved[id];
      S.solved[id] = true; save();
      if(first){ addXP(15); toast("🎉 Exercice réussi · +15 XP"); }
      $("#res").insertAdjacentHTML("afterbegin", `<div class="win">🎉 <b>Bravo, tous les tests passent !</b><div class="row" style="margin-top:10px">
        <button class="btn ghost sm" onclick="document.getElementById('solb').click()">📖 Comparer avec la correction</button>
        ${nextE?`<button class="btn sm" onclick="go('exos','${nextE.id}')">Exercice suivant →</button>`:`<button class="btn sm" onclick="go('exos')">Retour à l'atelier</button>`}</div></div>`);
    } else {
      const nOk = g.res.filter(r=>r.ok).length;
      $("#res").insertAdjacentHTML("beforeend", `<p class="note" style="margin:10px 0 0">${nOk?`Presque ! ${nOk} test(s) sur ${g.res.length} réussi(s). Regarde les tests ❌ : compare « Attendu » et « Obtenu ».`:"Aucun test ne passe encore. Lance ▶ Exécuter pour voir ce que fait ton code"}${EX.hint<hints.length?" — ou demande un 💡 indice.":"."}</p>`);
    }
  }

  function runConsole(){
    const cons = $("#cons");
    let prog;
    try{ prog = PC.parse(ta.value); } catch(er){ gutter(er.ln); cons.innerHTML = `<span class="er">⚠️ ${er.ln?`<a onclick="exoGoLine(${er.ln})">Ligne ${er.ln}</a> : `:""}${esc(er.message)}</span>`; return; }
    gutter();
    if(!prog.main.length && e.tests[0].call){
      cons.innerHTML = e.tests.map(t=>{ const r = PC.run(prog,{call:t.call});
        return r.err ? `<span class="er">${esc(t.call)} → ⚠️ ${r.err.ln?`ligne ${r.err.ln} : `:""}${esc(r.err.msg)}</span>`
          : r.out.map(o=>esc(o.text)).join("\n")+(r.out.length?"\n":"")+`<span class="pr">${esc(t.call)} → </span>${esc(PC.fmt(r.ret))}`; }).join("\n");
      return;
    }
    const inputs = $("#inp") ? $("#inp").value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean) : [];
    const r = PC.run(prog,{inputs, vars:e.tests[0].vars||{}});
    cons.innerHTML = (r.out.map(o=>o.prompt?`<span class="pr">${esc(o.text)} ▸</span>`:esc(o.text)).join("\n") || `<span class="pr">(rien d'affiché)</span>`)
      + (r.err ? `\n<span class="er">⚠️ ${r.err.ln?`<a onclick="exoGoLine(${r.err.ln})">Ligne ${r.err.ln}</a> : `:""}${esc(r.err.msg)}</span>` : `\n<span class="pr">— fin du programme (${r.steps} instructions exécutées)</span>`);
    if(r.err) gutter(r.err.ln);
  }
}

// ================== CLAVIER ==================
document.addEventListener("keydown", e=>{
  if(view==="flash" && FL && FL.deck.length){
    if(e.key===" "){ e.preventDefault(); $("#fc")?.classList.toggle("flip"); }
    if(e.key==="1") flAns(false); if(e.key==="2") flAns(true);
    return;
  }
  if(!QZ || !$(".qcard")) return;
  const q = QZ.qs[QZ.i];
  if(e.key==="Enter"){
    if(QZ.answered){ e.preventDefault(); nextQ(); }
    else if(q.t==="in"){ e.preventDefault(); answer($("#ans").value); }
    return;
  }
  if(QZ.answered || q.t==="in") return;
  const k = e.key.toLowerCase();
  if(q.t==="vf"){ if(k==="v") answer(1); if(k==="f") answer(0); return; }
  const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if(idx>=0 && idx<QZ.order.length) answer(QZ.order[idx]);
});

renderSide(); go("home");
</script>
